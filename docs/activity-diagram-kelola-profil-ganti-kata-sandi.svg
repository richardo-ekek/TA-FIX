<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1940" viewBox="0 0 3000 1940" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Activity Diagram — Kelola Profil dan Ganti Kata Sandi</title>
  <desc id="diagram-desc">Diagram aktivitas pengguna yang telah login untuk mengelola data profil, foto profil, dan mengganti kata sandi pada Portal Layanan.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e293b"/>
    </marker>
    <style>
      .frame { fill:#ffffff; stroke:#1e293b; stroke-width:3; }
      .titlebar { fill:#f97316; stroke:#1e293b; stroke-width:3; }
      .lane-head { fill:#f8fafc; stroke:#1e293b; stroke-width:3; }
      .user-lane { fill:#fffdf9; stroke:#cbd5e1; stroke-width:2; }
      .system-lane { fill:#f8fbff; stroke:#cbd5e1; stroke-width:2; }
      .user-node { fill:#ffffff; stroke:#475569; stroke-width:3; }
      .system-node { fill:#eff6ff; stroke:#2563eb; stroke-width:3; }
      .success-node { fill:#ecfdf5; stroke:#059669; stroke-width:3; }
      .error-node { fill:#fff1f2; stroke:#e11d48; stroke-width:3; }
      .note-node { fill:#fffbeb; stroke:#d97706; stroke-width:2.5; }
      .node { rx:16; ry:16; }
      .decision { fill:#ffffff; stroke:#334155; stroke-width:3; }
      .flow { fill:none; stroke:#1e293b; stroke-width:3.5; marker-end:url(#arrow); stroke-linejoin:round; stroke-linecap:round; }
      .title { font-family:Arial, Helvetica, sans-serif; font-size:37px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .lane-title { font-family:Arial, Helvetica, sans-serif; font-size:31px; font-weight:700; fill:#0f172a; text-anchor:middle; }
      .body { font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:19px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .branch { font-family:Arial, Helvetica, sans-serif; font-size:20px; font-weight:700; fill:#1d4ed8; }
      .yes { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#047857; }
      .no { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#be123c; }
      .foot { font-family:Arial, Helvetica, sans-serif; font-size:17px; fill:#334155; }
    </style>
  </defs>

  <!-- Header and horizontal swimlanes -->
  <rect class="frame" x="15" y="15" width="2970" height="1910"/>
  <rect class="titlebar" x="15" y="15" width="2970" height="88"/>
  <text class="title" x="1500" y="72">ACTIVITY DIAGRAM — KELOLA PROFIL &amp; GANTI KATA SANDI</text>
  <rect class="lane-head" x="15" y="103" width="2970" height="62"/>
  <text class="lane-title" x="1500" y="144">Prasyarat: pengguna telah login (middleware auth)</text>
  <rect class="user-lane" x="15" y="165" width="2970" height="385"/>
  <rect class="system-lane" x="15" y="550" width="2970" height="1210"/>
  <text class="lane-title" x="70" y="365" transform="rotate(-90 70 365)">Pengguna</text>
  <text class="lane-title" x="70" y="1170" transform="rotate(-90 70 1170)">Sistem</text>
  <line x1="120" y1="165" x2="120" y2="1760" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Open profile panel and choose a task -->
  <circle cx="175" cy="245" r="22" fill="#111827"/>
  <line class="flow" x1="197" y1="245" x2="245" y2="245"/>
  <rect class="user-node node" x="250" y="200" width="420" height="90"/>
  <text class="body" x="460" y="234"><tspan x="460">Akses menu</tspan><tspan x="460" dy="27">Profil</tspan></text>
  <line class="flow" x1="670" y1="245" x2="1240" y2="245"/>
  <rect class="system-node node" x="1250" y="200" width="500" height="90"/>
  <text class="body" x="1500" y="234"><tspan x="1500">Tampilkan panel</tspan><tspan x="1500" dy="27">Kelola Profil</tspan></text>
  <path class="flow" d="M1250 245 H900 V375 H1350"/>
  <polygon class="decision" points="1500,300 1650,375 1500,450 1350,375"/>
  <text class="body" x="1500" y="383">Pilih tindakan</text>

  <!-- Three independent user choices -->
  <text class="branch" x="155" y="475">[Ubah data profil]</text>
  <path class="flow" d="M1350 375 H400 V470"/>
  <rect class="user-node node" x="100" y="475" width="600" height="70"/>
  <text class="body" x="400" y="520">Isi data profil</text>

  <text class="branch" x="845" y="475">[Ubah foto profil]</text>
  <path class="flow" d="M1500 450 H1300 V470"/>
  <rect class="user-node node" x="1000" y="475" width="600" height="70"/>
  <text class="body" x="1300" y="520">Pilih dan unggah foto baru</text>

  <text class="branch" x="1845" y="475">[Ganti kata sandi]</text>
  <path class="flow" d="M1650 375 H2200 V470"/>
  <rect class="user-node node" x="1900" y="475" width="600" height="70"/>
  <text class="body" x="2200" y="508"><tspan x="2200">Isi password lama, password baru,</tspan><tspan x="2200" dy="25">dan konfirmasi password</tspan></text>

  <!-- Column 1: profile details -->
  <path class="flow" d="M400 545 V640"/>
  <rect class="system-node node" x="100" y="645" width="600" height="90"/>
  <text class="body" x="400" y="678"><tspan x="400">Perbarui data umum:</tspan><tspan x="400" dy="27">nama, tanggal lahir, alamat, no. telepon</tspan></text>
  <path class="flow" d="M400 735 V770"/>
  <polygon class="decision" points="400,770 540,840 400,910 260,840"/>
  <text class="small" x="400" y="833"><tspan x="400">Role</tspan><tspan x="400" dy="23">pengguna?</tspan></text>
  <text class="yes" x="150" y="825">[user]</text>
  <path class="flow" d="M260 840 H225 V955"/>
  <rect class="system-node node" x="100" y="960" width="250" height="80"/>
  <text class="small" x="225" y="992"><tspan x="225">Simpan data</tspan><tspan x="225" dy="23">pekerjaan</tspan></text>
  <text class="yes" x="495" y="825">[admin / super_admin / tim_hukum]</text>
  <path class="flow" d="M540 840 H575 V955"/>
  <rect class="system-node node" x="450" y="960" width="250" height="80"/>
  <text class="small" x="575" y="992"><tspan x="575">Simpan NIP</tspan><tspan x="575" dy="23">dan jabatan</tspan></text>
  <path class="flow" d="M225 1040 V1080 H400 V1110"/>
  <path class="flow" d="M575 1040 V1080 H400 V1110"/>
  <rect class="success-node node" x="160" y="1115" width="480" height="80"/>
  <text class="body" x="400" y="1164">Tampilkan profil berhasil diperbarui</text>

  <!-- Column 2: profile photo -->
  <path class="flow" d="M1300 545 V640"/>
  <rect class="system-node node" x="1000" y="645" width="600" height="90"/>
  <text class="body" x="1300" y="678"><tspan x="1300">Validasi file gambar</tspan><tspan x="1300" dy="27">JPEG/PNG/JPG/WebP, maksimum 2 MB</tspan></text>
  <path class="flow" d="M1300 735 V770"/>
  <polygon class="decision" points="1300,770 1440,840 1300,910 1160,840"/>
  <text class="small" x="1300" y="833"><tspan x="1300">Foto</tspan><tspan x="1300" dy="23">valid?</tspan></text>
  <text class="no" x="1460" y="823">[Tidak]</text>
  <path class="flow" d="M1440 840 H1510"/>
  <rect class="error-node node" x="1520" y="795" width="300" height="90"/>
  <text class="small" x="1670" y="827"><tspan x="1670">Tampilkan error;</tspan><tspan x="1670" dy="23">pilih foto lain</tspan></text>
  <text class="yes" x="1320" y="938">[Ya]</text>
  <path class="flow" d="M1300 910 V955"/>
  <rect class="system-node node" x="1000" y="960" width="600" height="80"/>
  <text class="body" x="1300" y="1009">Hapus foto lama jika tersedia</text>
  <path class="flow" d="M1300 1040 V1080"/>
  <rect class="system-node node" x="1000" y="1085" width="600" height="80"/>
  <text class="body" x="1300" y="1118"><tspan x="1300">Simpan foto baru dan perbarui</tspan><tspan x="1300" dy="27">path foto_profil</tspan></text>
  <path class="flow" d="M1300 1165 V1205"/>
  <rect class="success-node node" x="1060" y="1210" width="480" height="80"/>
  <text class="body" x="1300" y="1259">Tampilkan foto berhasil diperbarui</text>

  <!-- Column 3: password change -->
  <path class="flow" d="M2200 545 V640"/>
  <rect class="system-node node" x="1900" y="645" width="600" height="90"/>
  <text class="body" x="2200" y="678"><tspan x="2200">Validasi password lama,</tspan><tspan x="2200" dy="27">minimal 8 karakter, dan konfirmasi</tspan></text>
  <path class="flow" d="M2200 735 V770"/>
  <polygon class="decision" points="2200,770 2340,840 2200,910 2060,840"/>
  <text class="small" x="2200" y="833"><tspan x="2200">Data password</tspan><tspan x="2200" dy="23">valid?</tspan></text>
  <text class="no" x="2360" y="823">[Tidak]</text>
  <path class="flow" d="M2340 840 H2410"/>
  <rect class="error-node node" x="2420" y="795" width="400" height="90"/>
  <text class="small" x="2620" y="827"><tspan x="2620">Tampilkan error password lama,</tspan><tspan x="2620" dy="23">panjang, atau konfirmasi</tspan></text>
  <text class="yes" x="2220" y="938">[Ya]</text>
  <path class="flow" d="M2200 910 V955"/>
  <rect class="system-node node" x="1900" y="960" width="600" height="80"/>
  <text class="body" x="2200" y="1009">Hash dan simpan password baru</text>
  <path class="flow" d="M2200 1040 V1080"/>
  <rect class="success-node node" x="1960" y="1085" width="480" height="80"/>
  <text class="body" x="2200" y="1134">Tampilkan kata sandi berhasil diperbarui</text>

  <!-- Completion markers -->
  <line class="flow" x1="400" y1="1195" x2="400" y2="1260"/>
  <circle cx="400" cy="1300" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="400" cy="1300" r="18" fill="#111827"/>
  <line class="flow" x1="1300" y1="1290" x2="1300" y2="1355"/>
  <circle cx="1300" cy="1395" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="1300" cy="1395" r="18" fill="#111827"/>
  <line class="flow" x1="2200" y1="1165" x2="2200" y2="1230"/>
  <circle cx="2200" cy="1270" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="2200" cy="1270" r="18" fill="#111827"/>

  <!-- Scope note -->
  <rect class="note-node node" x="110" y="1650" width="2780" height="80"/>
  <text class="foot" x="1500" y="1683"><tspan x="1500" font-weight="700">Catatan rute /profile:</tspan><tspan x="1500" dy="23"> perubahan nama dan email divalidasi wajib/unik; jika email berubah, email_verified_at diatur ulang menjadi null.</tspan></text>
</svg>
