<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2020" viewBox="0 0 3200 2020" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Activity Diagram — Akses Arsip Kebijakan, Berita, dan Status Janji Temu</title>
  <desc id="diagram-desc">Diagram aktivitas pengguna yang sudah login ketika mengakses arsip kebijakan, portal berita, dan status janji temu di dashboard Portal Layanan.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e293b"/>
    </marker>
    <style>
      .frame { fill:#ffffff; stroke:#1e293b; stroke-width:3; }
      .titlebar { fill:#f97316; stroke:#1e293b; stroke-width:3; }
      .lane-head { fill:#f8fafc; stroke:#1e293b; stroke-width:3; }
      .user-lane { fill:#fffdf9; stroke:#cbd5e1; stroke-width:2; }
      .system-lane { fill:#f8fbff; stroke:#cbd5e1; stroke-width:2; }
      .user-node { fill:#ffffff; stroke:#475569; stroke-width:3; }
      .system-node { fill:#eff6ff; stroke:#2563eb; stroke-width:3; }
      .success-node { fill:#ecfdf5; stroke:#059669; stroke-width:3; }
      .error-node { fill:#fff1f2; stroke:#e11d48; stroke-width:3; }
      .note-node { fill:#fffbeb; stroke:#d97706; stroke-width:2.5; }
      .node { rx:16; ry:16; }
      .decision { fill:#ffffff; stroke:#334155; stroke-width:3; }
      .flow { fill:none; stroke:#1e293b; stroke-width:3.5; marker-end:url(#arrow); stroke-linejoin:round; stroke-linecap:round; }
      .title { font-family:Arial, Helvetica, sans-serif; font-size:37px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .lane-title { font-family:Arial, Helvetica, sans-serif; font-size:31px; font-weight:700; fill:#0f172a; text-anchor:middle; }
      .body { font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:19px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .branch { font-family:Arial, Helvetica, sans-serif; font-size:20px; font-weight:700; fill:#1d4ed8; }
      .yes { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#047857; }
      .no { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#be123c; }
      .foot { font-family:Arial, Helvetica, sans-serif; font-size:17px; fill:#334155; }
    </style>
  </defs>

  <!-- Title and horizontal swimlanes -->
  <rect class="frame" x="15" y="15" width="3170" height="1990"/>
  <rect class="titlebar" x="15" y="15" width="3170" height="88"/>
  <text class="title" x="1600" y="72">ACTIVITY DIAGRAM — AKSES ARSIP KEBIJAKAN, BERITA &amp; STATUS JANJI TEMU</text>
  <rect class="lane-head" x="15" y="103" width="3170" height="62"/>
  <text class="lane-title" x="1600" y="144">Prasyarat: pengguna dengan role user telah login</text>
  <rect class="user-lane" x="15" y="165" width="3170" height="405"/>
  <rect class="system-lane" x="15" y="570" width="3170" height="1230"/>
  <text class="lane-title" x="70" y="375" transform="rotate(-90 70 375)">Pengguna</text>
  <text class="lane-title" x="70" y="1190" transform="rotate(-90 70 1190)">Sistem</text>
  <line x1="120" y1="165" x2="120" y2="1800" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Enter user dashboard -->
  <circle cx="175" cy="245" r="22" fill="#111827"/>
  <line class="flow" x1="197" y1="245" x2="245" y2="245"/>
  <rect class="user-node node" x="250" y="200" width="470" height="90"/>
  <text class="body" x="485" y="234"><tspan x="485">Akses Dashboard</tspan><tspan x="485" dy="27">Pengguna</tspan></text>
  <line class="flow" x1="720" y1="245" x2="1330" y2="245"/>
  <rect class="system-node node" x="1340" y="200" width="560" height="90"/>
  <text class="body" x="1620" y="234"><tspan x="1620">Muat dashboard: arsip, berita approved,</tspan><tspan x="1620" dy="27">dan janji temu milik pengguna</tspan></text>
  <path class="flow" d="M1340 245 H980 V375 H1450"/>
  <polygon class="decision" points="1600,300 1750,375 1600,450 1450,375"/>
  <text class="body" x="1600" y="383">Pilih layanan</text>

  <!-- Three clean, independent user paths -->
  <text class="branch" x="150" y="480">[Arsip Kebijakan]</text>
  <path class="flow" d="M1450 375 H500 V470"/>
  <rect class="user-node node" x="100" y="475" width="800" height="78"/>
  <text class="body" x="500" y="507"><tspan x="500">Pilih MoU/PKS, TIK Kemlu, atau TIK Non-Kemlu;</tspan><tspan x="500" dy="25">gunakan pencarian/filter lalu klik Detail</tspan></text>

  <text class="branch" x="1160" y="480">[Portal Berita]</text>
  <path class="flow" d="M1600 450 H1500 V470"/>
  <rect class="user-node node" x="1100" y="475" width="800" height="78"/>
  <text class="body" x="1500" y="507"><tspan x="1500">Pilih kategori atau cari judul berita;</tspan><tspan x="1500" dy="25">klik Baca Selengkapnya</tspan></text>

  <text class="branch" x="2160" y="480">[Status Janji Temu]</text>
  <path class="flow" d="M1750 375 H2500 V470"/>
  <rect class="user-node node" x="2100" y="475" width="800" height="78"/>
  <text class="body" x="2500" y="507"><tspan x="2500">Pilih janji temu pada riwayat</tspan><tspan x="2500" dy="25">dan klik Lihat Detail</tspan></text>

  <!-- Column 1: policy archive -->
  <path class="flow" d="M500 553 V640"/>
  <rect class="system-node node" x="100" y="645" width="800" height="90"/>
  <text class="body" x="500" y="678"><tspan x="500">Tampilkan daftar arsip dan terapkan filter</tspan><tspan x="500" dy="27">kategori, kata kunci, instansi/satker, dan tahun</tspan></text>
  <path class="flow" d="M500 735 V780"/>
  <rect class="system-node node" x="100" y="785" width="800" height="80"/>
  <text class="body" x="500" y="834">Tambahkan penghitung views dokumen (+1)</text>
  <path class="flow" d="M500 865 V910"/>
  <rect class="system-node node" x="100" y="915" width="800" height="90"/>
  <text class="body" x="500" y="948"><tspan x="500">Tampilkan modal detail:</tspan><tspan x="500" dy="27">judul, keterangan, dan tautan dokumen</tspan></text>
  <path class="flow" d="M500 1005 V1040"/>
  <polygon class="decision" points="500,1040 640,1110 500,1180 360,1110"/>
  <text class="small" x="500" y="1103"><tspan x="500">Tautan dokumen</tspan><tspan x="500" dy="23">tersedia?</tspan></text>
  <text class="yes" x="240" y="1095">[Ya]</text>
  <path class="flow" d="M360 1110 H270 V1210"/>
  <rect class="success-node node" x="100" y="1215" width="340" height="80"/>
  <text class="small" x="270" y="1247"><tspan x="270">Buka tautan</tspan><tspan x="270" dy="23">dokumen</tspan></text>
  <text class="no" x="660" y="1095">[Tidak]</text>
  <path class="flow" d="M640 1110 H730 V1210"/>
  <rect class="success-node node" x="560" y="1215" width="340" height="80"/>
  <text class="small" x="730" y="1247"><tspan x="730">Tampilkan detail</tspan><tspan x="730" dy="23">tanpa tautan</tspan></text>

  <!-- Column 2: news portal -->
  <path class="flow" d="M1500 553 V640"/>
  <rect class="system-node node" x="1100" y="645" width="800" height="90"/>
  <text class="body" x="1500" y="678"><tspan x="1500">Tampilkan hanya berita</tspan><tspan x="1500" dy="27">berstatus approved</tspan></text>
  <path class="flow" d="M1500 735 V780"/>
  <rect class="system-node node" x="1100" y="785" width="800" height="80"/>
  <text class="body" x="1500" y="834">Tambahkan penghitung views berita (+1)</text>
  <path class="flow" d="M1500 865 V910"/>
  <rect class="system-node node" x="1100" y="915" width="800" height="105"/>
  <text class="body" x="1500" y="948"><tspan x="1500">Tampilkan modal artikel:</tspan><tspan x="1500" dy="27">foto, kategori, tanggal/lokasi, lead, isi, dan closing</tspan></text>
  <path class="flow" d="M1500 1020 V1070"/>
  <rect class="success-node node" x="1260" y="1075" width="480" height="80"/>
  <text class="body" x="1500" y="1124">Pengguna membaca berita lengkap</text>

  <!-- Column 3: user-owned appointment status -->
  <path class="flow" d="M2500 553 V640"/>
  <rect class="system-node node" x="2100" y="645" width="800" height="90"/>
  <text class="body" x="2500" y="678"><tspan x="2500">Ambil janji temu dengan user_id pengguna</tspan><tspan x="2500" dy="27">dan urutkan dari yang terbaru</tspan></text>
  <path class="flow" d="M2500 735 V780"/>
  <rect class="system-node node" x="2100" y="785" width="800" height="90"/>
  <text class="body" x="2500" y="818"><tspan x="2500">Tampilkan riwayat serta</tspan><tspan x="2500" dy="27">status janji temu terkini</tspan></text>
  <path class="flow" d="M2500 875 V910"/>
  <polygon class="decision" points="2500,910 2640,980 2500,1050 2360,980"/>
  <text class="small" x="2500" y="973"><tspan x="2500">Status</tspan><tspan x="2500" dy="23">janji temu?</tspan></text>
  <text class="no" x="2165" y="962">[rejected]</text>
  <path class="flow" d="M2360 980 H2260 V1090"/>
  <rect class="error-node node" x="2100" y="1095" width="320" height="90"/>
  <text class="small" x="2260" y="1127"><tspan x="2260">Tampilkan alasan</tspan><tspan x="2260" dy="23">penolakan admin</tspan></text>
  <text class="no" x="2655" y="962">[submitted / processing]</text>
  <path class="flow" d="M2640 980 H2750 V1090"/>
  <rect class="system-node node" x="2590" y="1095" width="320" height="90"/>
  <text class="small" x="2750" y="1127"><tspan x="2750">Tampilkan status</tspan><tspan x="2750" dy="23">menunggu proses</tspan></text>
  <text class="yes" x="2520" y="1078">[approved]</text>
  <path class="flow" d="M2500 1050 V1090"/>
  <polygon class="decision" points="2500,1090 2640,1160 2500,1230 2360,1160"/>
  <text class="small" x="2500" y="1153"><tspan x="2500">Mode</tspan><tspan x="2500" dy="23">pertemuan?</tspan></text>
  <text class="yes" x="2165" y="1143">[daring]</text>
  <path class="flow" d="M2360 1160 H2260 V1270"/>
  <rect class="success-node node" x="2100" y="1275" width="320" height="95"/>
  <text class="small" x="2260" y="1307"><tspan x="2260">Tampilkan jadwal fix,</tspan><tspan x="2260" dy="23">link meeting, dan catatan</tspan></text>
  <text class="yes" x="2660" y="1143">[luring]</text>
  <path class="flow" d="M2640 1160 H2750 V1270"/>
  <rect class="success-node node" x="2590" y="1275" width="320" height="95"/>
  <text class="small" x="2750" y="1307"><tspan x="2750">Tampilkan jadwal fix,</tspan><tspan x="2750" dy="23">lokasi, Maps, dan catatan</tspan></text>

  <!-- Independent end markers -->
  <line class="flow" x1="270" y1="1295" x2="270" y2="1360"/>
  <circle cx="270" cy="1400" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="270" cy="1400" r="18" fill="#111827"/>
  <line class="flow" x1="730" y1="1295" x2="730" y2="1360"/>
  <circle cx="730" cy="1400" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="730" cy="1400" r="18" fill="#111827"/>
  <line class="flow" x1="1500" y1="1155" x2="1500" y2="1220"/>
  <circle cx="1500" cy="1260" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="1500" cy="1260" r="18" fill="#111827"/>
  <line class="flow" x1="2260" y1="1185" x2="2260" y2="1210"/>
  <circle cx="2260" cy="1250" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="2260" cy="1250" r="18" fill="#111827"/>
  <line class="flow" x1="2750" y1="1185" x2="2750" y2="1210"/>
  <circle cx="2750" cy="1250" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="2750" cy="1250" r="18" fill="#111827"/>
  <line class="flow" x1="2260" y1="1370" x2="2260" y2="1410"/>
  <circle cx="2260" cy="1450" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="2260" cy="1450" r="18" fill="#111827"/>
  <line class="flow" x1="2750" y1="1370" x2="2750" y2="1410"/>
  <circle cx="2750" cy="1450" r="28" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="2750" cy="1450" r="18" fill="#111827"/>

  <!-- Implementation notes -->
  <rect class="note-node node" x="100" y="1660" width="3000" height="92"/>
  <text class="foot" x="1600" y="1694"><tspan x="1600" font-weight="700">Catatan implementasi:</tspan><tspan x="1600" dy="24">arsip kebijakan saat ini dimuat dari seluruh data MoU/PKS, TIK Kemlu, dan TIK Non-Kemlu tanpa filter status di UserController;</tspan><tspan x="1600" dy="21">berita yang tampil dibatasi status approved. Pembaruan status janji temu dilakukan admin dan dapat mengirim notifikasi email kepada pengguna.</tspan></text>
</svg>
