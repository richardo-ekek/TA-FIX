<svg xmlns="http://www.w3.org/2000/svg" width="3300" height="2320" viewBox="0 0 3300 2320" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Activity Diagram — Verifikasi Legalitas Dokumen oleh Tim Hukum</title>
  <desc id="diagram-desc">Diagram aktivitas Tim Hukum dalam memeriksa draf kebijakan berstatus pending_hukum, kemudian meneruskannya ke Super Admin atau meminta Admin memperbaikinya.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e293b"/>
    </marker>
    <style>
      .frame { fill:#ffffff; stroke:#1e293b; stroke-width:3; }
      .titlebar { fill:#f97316; stroke:#1e293b; stroke-width:3; }
      .lanehead { fill:#f8fafc; stroke:#1e293b; stroke-width:3; }
      .legallane { fill:#fffdf9; stroke:#cbd5e1; stroke-width:2; }
      .systemlane { fill:#f8fbff; stroke:#cbd5e1; stroke-width:2; }
      .legalnode { fill:#ffffff; stroke:#475569; stroke-width:3; }
      .systemnode { fill:#eff6ff; stroke:#2563eb; stroke-width:3; }
      .approvednode { fill:#ecfdf5; stroke:#059669; stroke-width:3; }
      .revisionnode { fill:#eef2ff; stroke:#4f46e5; stroke-width:3; }
      .notenode { fill:#fffbeb; stroke:#d97706; stroke-width:2.5; }
      .node { rx:16; ry:16; }
      .decision { fill:#ffffff; stroke:#334155; stroke-width:3; }
      .flow { fill:none; stroke:#1e293b; stroke-width:3.5; marker-end:url(#arrow); stroke-linejoin:round; stroke-linecap:round; }
      .title { font-family:Arial, Helvetica, sans-serif; font-size:36px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .lane-title { font-family:Arial, Helvetica, sans-serif; font-size:31px; font-weight:700; fill:#0f172a; text-anchor:middle; }
      .body { font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:19px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .tiny { font-family:Arial, Helvetica, sans-serif; font-size:17px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .branch { font-family:Arial, Helvetica, sans-serif; font-size:19px; font-weight:700; }
      .yes { fill:#047857; }
      .no { fill:#4338ca; }
      .foot { font-family:Arial, Helvetica, sans-serif; font-size:17px; fill:#334155; }
    </style>
  </defs>

  <!-- Page and swimlanes -->
  <rect class="frame" x="15" y="15" width="3270" height="2290"/>
  <rect class="titlebar" x="15" y="15" width="3270" height="88"/>
  <text class="title" x="1650" y="72">ACTIVITY DIAGRAM — VERIFIKASI LEGALITAS DOKUMEN OLEH TIM HUKUM</text>
  <rect class="lanehead" x="15" y="103" width="1050" height="64"/>
  <rect class="lanehead" x="1065" y="103" width="2220" height="64"/>
  <text class="lane-title" x="540" y="144">Tim Hukum</text>
  <text class="lane-title" x="2175" y="144">Sistem</text>
  <rect class="legallane" x="15" y="167" width="1050" height="2050"/>
  <rect class="systemlane" x="1065" y="167" width="2220" height="2050"/>

  <!-- Queue access and review -->
  <circle cx="100" cy="245" r="22" fill="#111827"/>
  <line class="flow" x1="122" y1="245" x2="175" y2="245"/>
  <rect class="legalnode node" x="180" y="198" width="580" height="94"/>
  <text class="body" x="470" y="234"><tspan x="470">Akses dashboard Tim Hukum</tspan><tspan x="470" dy="27">menu Antrean Verifikasi</tspan></text>

  <line class="flow" x1="760" y1="245" x2="1320" y2="245"/>
  <rect class="systemnode node" x="1320" y="198" width="810" height="94"/>
  <text class="body" x="1725" y="234"><tspan x="1725">Gabungkan dokumen MoU/PKS, TIK Kemlu,</tspan><tspan x="1725" dy="27">dan TIK Non-Kemlu; filter pending_hukum</tspan></text>

  <path class="flow" d="M1320 245 H940 V410 H790"/>
  <rect class="legalnode node" x="170" y="365" width="620" height="90"/>
  <text class="body" x="480" y="399"><tspan x="480">Pilih dokumen antrean dan</tspan><tspan x="480" dy="27">lihat detail isi dokumen</tspan></text>

  <line class="flow" x1="790" y1="410" x2="1320" y2="410"/>
  <rect class="systemnode node" x="1320" y="365" width="810" height="90"/>
  <text class="body" x="1725" y="399"><tspan x="1725">Tampilkan data kategori, isi draf, pembuat,</tspan><tspan x="1725" dy="27">tautan, serta jejak revisi sebelumnya</tspan></text>

  <path class="flow" d="M1320 410 H960 V585 H790"/>
  <rect class="legalnode node" x="170" y="535" width="620" height="100"/>
  <text class="body" x="480" y="570"><tspan x="480">Periksa klausul, regulasi nasional,</tspan><tspan x="480" dy="27">dan kesesuaian perjanjian internasional</tspan></text>
  <path class="flow" d="M480 635 V665"/>
  <polygon class="decision" points="480,665 620,735 480,805 340,735"/>
  <text class="small" x="480" y="728"><tspan x="480">Keputusan</tspan><tspan x="480" dy="24">legalitas?</tspan></text>

  <!-- Approval branch -->
  <text class="branch yes" x="115" y="720">[Lolos verifikasi]</text>
  <path class="flow" d="M340 735 H265 V925"/>
  <rect class="legalnode node" x="80" y="925" width="370" height="100"/>
  <text class="small" x="265" y="958"><tspan x="265">Pilih Lolos Verifikasi;</tspan><tspan x="265" dy="24">catatan dan BA bersifat opsional</tspan></text>

  <path class="flow" d="M450 975 H1320"/>
  <rect class="approvednode node" x="1320" y="910" width="750" height="115"/>
  <text class="body" x="1695" y="944"><tspan x="1695">Validasi catatan (maks. 1.000 karakter)</tspan><tspan x="1695" dy="27">dan file Berita Acara opsional:</tspan><tspan x="1695" dy="27">PDF/DOC/DOCX, maksimal 5 MB</tspan></text>
  <path class="flow" d="M1695 1025 V1080"/>
  <polygon class="decision" points="1695,1080 1855,1150 1695,1220 1535,1150"/>
  <text class="small" x="1695" y="1143"><tspan x="1695">File Berita Acara</tspan><tspan x="1695" dy="24">diunggah?</tspan></text>

  <text class="branch yes" x="1260" y="1132">[Ya]</text>
  <path class="flow" d="M1535 1150 H1450 V1320"/>
  <rect class="approvednode node" x="1150" y="1320" width="600" height="120"/>
  <text class="body" x="1450" y="1355"><tspan x="1450">Simpan Berita Acara manual ke</tspan><tspan x="1450" dy="27">storage publik dan catat</tspan><tspan x="1450" dy="27">Lolos Verifikasi Hukum (BA Manual)</tspan></text>

  <text class="branch no" x="1890" y="1132">[Tidak]</text>
  <path class="flow" d="M1855 1150 H2150 V1320"/>
  <rect class="approvednode node" x="1850" y="1320" width="600" height="120"/>
  <text class="body" x="2150" y="1355"><tspan x="2150">Buat PDF Berita Acara otomatis</tspan><tspan x="2150" dy="27">dengan TTD sistem, lalu simpan</tspan><tspan x="2150" dy="27">ke storage publik</tspan></text>

  <!-- Clean join for the two BA options -->
  <path class="flow" d="M1450 1440 V1490"/>
  <path class="flow" d="M2150 1440 V1490"/>
  <rect x="1450" y="1490" width="700" height="12" rx="4" fill="#1e293b"/>
  <path class="flow" d="M1800 1502 V1560"/>
  <rect class="approvednode node" x="1350" y="1560" width="900" height="140"/>
  <text class="body" x="1800" y="1595"><tspan x="1800">Simpan keputusan: tim_hukum_id, status = pending_superadmin,</tspan><tspan x="1800" dy="27">file Berita Acara, catatan legal, dan alasan_penolakan = null;</tspan><tspan x="1800" dy="27">tambahkan riwayat “Disetujui Legal”</tspan></text>
  <path class="flow" d="M1800 1700 V1750"/>
  <rect class="systemnode node" x="1350" y="1750" width="900" height="100"/>
  <text class="body" x="1800" y="1786"><tspan x="1800">Buat Activity Log / audit trail dan tampilkan</tspan><tspan x="1800" dy="27">sukses: diteruskan ke Pimpinan (Super Admin)</tspan></text>
  <path class="flow" d="M1800 1850 V1900"/>
  <circle cx="1800" cy="1940" r="29" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="1800" cy="1940" r="19" fill="#111827"/>

  <!-- Revision branch kept in an isolated right column -->
  <text class="branch no" x="700" y="720">[Minta perbaikan]</text>
  <path class="flow" d="M620 735 H825 V925"/>
  <rect class="legalnode node" x="650" y="925" width="350" height="100"/>
  <text class="small" x="825" y="958"><tspan x="825">Pilih Minta Perbaikan</tspan><tspan x="825" dy="24">dan tulis catatan hukum</tspan></text>

  <path class="flow" d="M1000 975 H1120 V1040 H2420 V1155"/>
  <rect class="revisionnode node" x="2420" y="1100" width="720" height="110"/>
  <text class="body" x="2780" y="1137"><tspan x="2780">Validasi catatan hukum wajib diisi</tspan><tspan x="2780" dy="27">dan minimal lima karakter</tspan></text>
  <path class="flow" d="M2780 1210 V1260"/>
  <rect class="revisionnode node" x="2420" y="1260" width="720" height="150"/>
  <text class="body" x="2780" y="1293"><tspan x="2780">Simpan tim_hukum_id, status = revisi_hukum,</tspan><tspan x="2780" dy="27">revisi_ke + 1, catatan pada alasan_penolakan,</tspan><tspan x="2780" dy="27">dan jejak revisi kronologis</tspan></text>
  <path class="flow" d="M2780 1410 V1460"/>
  <rect class="systemnode node" x="2420" y="1460" width="720" height="105"/>
  <text class="body" x="2780" y="1496"><tspan x="2780">Buat Activity Log / audit trail</tspan><tspan x="2780" dy="27">untuk revisi hukum</tspan></text>
  <path class="flow" d="M2780 1565 V1620"/>
  <rect class="revisionnode node" x="2420" y="1620" width="720" height="100"/>
  <text class="body" x="2780" y="1657"><tspan x="2780">Tampilkan sukses dan kembalikan</tspan><tspan x="2780" dy="27">dokumen kepada Admin untuk diperbaiki</tspan></text>
  <path class="flow" d="M2780 1720 V1765"/>
  <circle cx="2780" cy="1805" r="29" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <circle cx="2780" cy="1805" r="19" fill="#111827"/>

  <!-- Implementation note -->
  <rect class="notenode node" x="1100" y="2020" width="2040" height="125"/>
  <text class="foot" x="2120" y="2052"><tspan x="2120" font-weight="700">Catatan implementasi:</tspan><tspan x="2120" dy="25">UI hanya menawarkan approved dan revisi. Controller juga menerima alias setujui/teruskan sebagai lolos dan tolak sebagai revisi; aksi selain itu menghasilkan pesan error.</tspan></text>

  <text class="foot" x="40" y="2265">Ruang lingkup: verifikasi Tim Hukum atas draf MoU/PKS, TIK Kemlu, dan TIK Non-Kemlu yang berstatus pending_hukum.</text>
</svg>
